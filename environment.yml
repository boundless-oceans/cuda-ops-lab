  - cuda-nvtx=11.8.86=0
  - cuda-runtime=11.8.0=0
  - filelock=3.13.1=py39h06a4308_0
  - gmp=6.2.1=h295c915_3
  - gmpy2=2.1.2=py39heeb90bb_0
  - intel-openmp=2023.1.0=hdb19cb5_46306
  - jinja2=3.1.2=py39h06a4308_0
