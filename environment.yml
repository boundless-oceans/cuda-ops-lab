# cuda-ops-lab 开发环境
#
# 用法：
#   conda env create -f environment.yml            # 环境名 opslab（见下方 name）
#   conda env create -f environment.yml -n 别的名字
#   conda activate opslab
#
# 自检：
#   conda run -n opslab python -c "import torch; print(torch.__version__, torch.version.cuda)"
#   # 期望：2.0.1 11.8
#   # torch.cuda.is_available() 在无 GPU 的沙箱里为 False，属正常
#
# ===========================================================================
# 一、为什么是这几样东西（每条都是实测后的取舍）
# ===========================================================================
# python 3.9 + pytorch 2.0.1 + pytorch-cuda 11.8
#   必须与**系统 nvcc** 对齐：本机 nvcc 是 CUDA 11.8.89（/usr/local/cuda-11.8）。
#   torch 头文件版本与 nvcc 不一致会出各种诡异错误（c10::cuda 符号缺失、ABI 冲突）。
#   选 3.9 而非 3.10：本机 conda 缓存里已有 python-3.9.18 与
#   pytorch-2.0.1-py3.9_cuda11.8_cudnn8.7.0，可完全复用。
#
# 不装 cudatoolkit
#   编译用系统 nvcc。若在 conda 里再装一份 cudatoolkit，PATH 上会出现第二套
#   nvcc/头文件，容易和 /usr/local/cuda-11.8 打架。
#   torch 运行期需要的 CUDA 运行库由 pytorch-cuda 自带（来自 nvidia channel）。
#
# numpy 1.26.2（即 numpy<2）
#   torch 2.0.1 按 numpy 1.x 的 C-API 编译，在 numpy 2.x 下 `import torch` 会报
#   "A module that was compiled using NumPy 1.x cannot be run in NumPy 2.x"。
#
# ninja 1.12.1
#   仓库的 python/ops_lab/_build.py 是自研 ninja 构建（自己生成 build.ninja），
#   只需要 ninja **可执行文件**。注意两个实测坑：
#     * ninja 位于 $CONDA_PREFIX/bin，但不一定在 PATH 上（沙箱里就看不到）
#     * 这个 conda 包**不含 ninja 的 Python 模块**，所以
#       torch.utils.cpp_extension.load() 那条路走不通
#   → 构建脚本必须主动探测 ninja 路径，不能依赖 PATH。
#
# channels 只留 pytorch / nvidia / defaults
#   刻意不加 conda-forge：conda 默认 channel_priority 是 flexible，多一个 channel
#   就可能把 numpy/python 解析到 conda-forge 的更新版本上，从而绕开本地缓存、
#   变成几百 MB 的额外下载。这三个 channel 正是下方缓存命中的来源。
#
# ===========================================================================
# 二、关于下面那段"精确锁定"（重要，别删之前先看这里）
# ===========================================================================
# 实测对比（conda 求解结果，非估算）：
#   不锁版本：解出 80 个包，命中本机缓存 20 个，需下载 60 个，共 246 MB
#             （大头：mkl 119MB + icu 27MB + python 24MB + intel-openmp 20MB）
#   锁版本  ：解出 62 个包，命中本机缓存 59 个，需下载  3 个，共 ~0 MB
#
# 所以锁定有两个好处：
#   1. 建环境几乎零下载（246MB → 0MB）
#   2. 可复现 —— README 里那些实测带宽数字能对应到确定的版本组合
#
# 锁定的版本不是我挑的，而是 sugar 环境里**已经跑通 torch 2.0.1+cu118** 的那一套，
# 且上面的求解已验证通过。
#
# 如果换机器后解析失败（老 build 从 channel 下架），把「传递依赖锁定」整段删掉即可，
# 只留顶层的 6 条需求，conda 会自己解出可用版本，代价是多下载约 250MB。
#
# ===========================================================================
# 三、已知环境坑（脚本里已处理，见 python/ops_lab/envguard.py）
# ===========================================================================
# 本机全局 PYTHONPATH 指向 /opt/ros/humble/lib/python3.10/site-packages
# （ROS2 Humble 装在**系统** python3.10 上，与本仓库无关）。这些路径会混进
# python3.9 解释器的 sys.path：纯 Python 包可能被意外导入，带 .so 的会报 ELF 错误，
# 行为不确定且难排查。因此仓库所有入口脚本（check_env / run_all / run_bench / _build）
# 启动时都会主动把这些外来路径从 sys.path 剔除。
#
# 顺带一条教训：`pip list` **不能**用来判断某个 conda 环境里装了什么。
# 它走 importlib.metadata，会扫描整个 sys.path，把 PYTHONPATH 里的 ROS 包也列出来
# （正是这一点让我一度误判 sugar 是 ROS 环境）。要判断环境内容请用
# `conda list -n <env>`，或直接看 <env>/lib/python3.x/site-packages/ 目录。
# ===========================================================================

name: opslab

channels:
  - pytorch
  - nvidia
  - defaults

dependencies:
  # ------------------------------------------------------------------
  # 顶层需求：这几条是"我要什么"。换机器/换时间点时，主要调整这里。
  # ------------------------------------------------------------------
  - python=3.9.18=h955ad1f_0
  - pytorch=2.0.1=py3.9_cuda11.8_cudnn8.7.0_0
  - pytorch-cuda=11.8=h7e8668a_5
  - numpy=1.26.2=py39h5f9d8c6_0
  - ninja=1.12.1=h06a4308_0
  - pip=23.3.1=py39h06a4308_0

  # ------------------------------------------------------------------
  # 传递依赖锁定：从上面这 6 条推导出来的依赖，锁到 sugar 已验证的版本。
  # 解析失败就整段删掉（见文件头「二、关于精确锁定」）。
  # ------------------------------------------------------------------
  - _libgcc_mutex=0.1=main
  - _openmp_mutex=5.1=1_gnu
  - blas=1.0=mkl
  - bzip2=1.0.8=h7b6447c_0
  - ca-certificates=2025.12.2=h06a4308_0
